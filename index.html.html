<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f1f1;
        }
        form{
            width: 300px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        label{
            display: block;
            margin-bottom: 5px;
        }
        input, select{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        a{
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover{
            background-color: #0056b3;
        }
        #resp{
            width: 300px;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>
<form>
    <label>Valor A</label>
    <input type="number" id="v1">

    <label>Valor B</label>
    <input type="number" id="v2">

    <label>Operação</label>

    <select id="oper">
        <option>Soma</option>
        <option>Subtração</option>
        <option>Multiplicação</option>
        <option>Divisão</option>
        <option>Potência</option>
    </select>

    <a href="#" onclick="executar(); return false;">Executar</a>
</form>

<div id="resp">O resultado aparece aqui</div>

<script>
    const somar = (a, b) => a + b;
    const subtrair = (a, b) => a - b;
    const multiplicar = (a, b) => a * b;
    const dividir = (a, b) => b === 0 ? "Não é possível dividir por zero" : a / b;
    const exponencial = (a, b) => a ** b;

    const executar = () => {
        const a = Number(document.getElementById("v1").value);
        const b = Number(document.getElementById("v2").value);
        const oper = document.getElementById("oper").selectedIndex;

        let resultado;

        if (oper === 0) {
            resultado = somar(a, b);
        } else if (oper === 1) {
            resultado = subtrair(a, b);
        } else if (oper === 2) {
            resultado = multiplicar(a, b);
        } else if (oper === 3) {
            resultado = dividir(a, b);
        } else {
            resultado = exponencial(a, b);
        }

        document.getElementById("resp").innerHTML = `O resultado da operação é: ${resultado}`;
    }
</script>
</body>
</html>
